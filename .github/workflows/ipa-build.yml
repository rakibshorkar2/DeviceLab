name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build DeviceLab IPA (unsigned)
    runs-on: macos-26
    timeout-minutes: 45

    env:
      XCODE_VERSION: 26.6
      PROJECT: DeviceLab.xcodeproj
      SCHEME: DeviceLab
      SDK: iphoneos
      CONFIGURATION: Release
      DERIVED_DATA: ${{ github.workspace }}/derived

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Bake build number into Info.plist
        run: |
          BUILD_NUMBER="${{ github.run_number }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER}" DeviceLab/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER}" DeviceLabWidgets/Info.plist
          echo "Baked build number: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' DeviceLab/Info.plist)"

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk "$SDK" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_PATH="$DERIVED_DATA/Build/Products/$CONFIGURATION-iphoneos/DeviceLab.app"
          test -d "$APP_PATH" || { echo "DeviceLab.app not found"; exit 1; }
          ls -la "$APP_PATH"
          echo "--- Embedded extensions ---"
          ls -la "$APP_PATH/PlugIns" || echo "No PlugIns"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          BUILD_NUMBER="${{ github.run_number }}"
          ZIP_FILE="DeviceLab-1.0.0-b${BUILD_NUMBER}-unsigned.ipa"
          ditto -c -k --sequesterRsrc --keepParent Payload "$ZIP_FILE"
          ls -lh "$ZIP_FILE"
          echo "ipa_name=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ipa_name }}
          path: ${{ env.ipa_name }}
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_NUMBER="${{ github.run_number }}"
          VERSION="1.0.0"
          TAG="v${VERSION}-build${BUILD_NUMBER}"
          gh release create "$TAG" "${{ env.ipa_name }}" \
            --repo "${{ github.repository }}" \
            --title "Build $BUILD_NUMBER" \
            --notes "**DeviceLab $VERSION — Build $BUILD_NUMBER**

- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
- Commit: ${{ github.sha }}
- Artifact: ${{ env.ipa_name }} (unsigned, sideload with AltStore / SideStore / LiveContainer / Feather)

This IPA is built with no code signing so sideloading tools can re-sign and install it on your iPhone 15 Pro (iOS 26)." \
            --latest
          echo "Release created: $TAG"
